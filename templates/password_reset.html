{% extends "base.html" %}

{% block title %}Password Reset | TakaSave{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 mt-4 mb-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="icon-circle mx-auto mb-3 d-flex align-items-center justify-content-center"
                             style="width:60px;height:60px;border-radius:50%;background-color:rgba(79,70,229,0.1);">
                            <i class="bi bi-key-fill fs-2 text-primary"></i>
                        </div>
                        <h3 class="card-title fw-bold text-dark">Reset Password</h3>
                        <p class="text-muted small">Enter your email and we'll send you a reset link.</p>
                    </div>

                    <form method="POST" action="{% url 'password_reset_request' %}" novalidate>
                        {% csrf_token %}
                        <div class="form-floating mb-4">
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="name@example.com"
                                required>
                            <label for="email" class="text-muted"><i class="bi bi-envelope me-2"></i>Email Address</label>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill hover-lift shadow-sm">
                                Send Reset Link <i class="bi bi-arrow-right ms-1"></i>
                            </button>
                        </div>
                    </form>

                    <div class="text-center small">
                        <a href="{% url 'login' %}" class="text-decoration-none fw-semibold">
                            <i class="bi bi-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
            <p class="text-center text-muted mt-2 small">© {{ now.year }} md-mostafaraihan. All rights reserved.</p>
        </div>
    </div>
</div>
{% endblock %}
